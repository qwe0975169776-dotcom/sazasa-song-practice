<title>手牽手 跟唱教室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a sticky "music stand" control bar over a tall lyric sheet; sections stack as rows of hand-written-style characters with vertical zhuyin. */
:root{
  --paper:#F2F5F7; --sheet:#FFFFFF; --ink:#1E2B38; --muted:#748391; --rule:#D5DEE6;
  --accent:#EB6A2C; --accent-soft:#FDEBDF; --sung:#2C8A75; --chip:#E6ECF1;
  --f-lyric:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --lyric:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121920; --sheet:#1A232C; --ink:#E7EDF2; --muted:#8A99A6; --rule:#2B3743;
  --accent:#FF8A4C; --accent-soft:#3A2619; --sung:#5CC3A8; --chip:#24303B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121920; --sheet:#1A232C; --ink:#E7EDF2; --muted:#8A99A6; --rule:#2B3743;
  --accent:#FF8A4C; --accent-soft:#3A2619; --sung:#5CC3A8; --chip:#24303B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row+.row{margin-top:10px}
.title{font-family:var(--f-lyric);font-size:28px;font-weight:700;margin:0 6px 0 0;letter-spacing:.06em}
.play{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:24px;display:grid;place-items:center;flex:none}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:8px 12px;min-height:40px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.ctl{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:10px;padding:4px 10px;min-height:40px}
.ctl label{font-size:13px;color:var(--muted);white-space:nowrap}
.ctl input[type=range]{width:120px;accent-color:var(--accent)}
.ctl output{min-width:3.2em;font-variant-numeric:tabular-nums;font-weight:500}
.now{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.now .where{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .where b{color:var(--ink);font-weight:700}
#seek{width:100%;accent-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:7px 14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.more[hidden]{display:none!important}

main{padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px;margin:0 auto}
.sec{margin-bottom:28px}
.sec h2{font-size:14px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.sec.cur h2{color:var(--accent)}
.line{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;transition:background .2s}
.line.cur{background:var(--accent-soft)}
.lp{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);font-size:15px;color:var(--muted)}
.line.cur .lp{border-color:var(--accent);color:var(--accent)}
.lyr{display:flex;flex-wrap:wrap;gap:0 calc(var(--lyric)*.12);min-width:0;font-family:var(--f-lyric)}
.empty{color:var(--muted);font-size:15px;font-family:var(--f-ui)}

.ch{display:inline-flex;align-items:center;padding:2px 2px 6px;border-bottom:4px solid transparent;cursor:pointer;line-height:1}
.h{font-size:var(--lyric);color:var(--ink)}
.zy{display:inline-flex;align-items:center;margin-left:calc(var(--lyric)*.04);font-size:calc(var(--lyric)*.3);color:var(--ink);height:calc(var(--lyric)*1.0)}
.zb{writing-mode:vertical-rl;text-orientation:upright;line-height:1;letter-spacing:-.05em;white-space:nowrap}
.tn{display:inline-block;transform:translate(.62em,-.55em);width:0;overflow:visible}
.lt{display:inline-block}
.noZy .zy{display:none}
.ch.done .h,.ch.done .zy{color:var(--sung)}
.ch.on .h,.ch.on .zy{color:var(--accent)}
.ch.on{border-bottom-color:var(--accent)}
.hideLyr .ch .h,.hideLyr .ch .zy{color:transparent!important}
.hideLyr .ch{border-bottom-color:var(--rule)}
.hideLyr .ch.on{border-bottom-color:var(--accent)}
.hideLyr .ch.done{border-bottom-color:var(--sung)}
.hideLyr .ch.peek .h,.hideLyr .ch.peek .zy{color:var(--muted)!important}

.pop{position:fixed;z-index:20;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:min(420px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px}
.pop .big{font-family:var(--f-lyric);font-size:40px;line-height:1}
.pop input{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:20px;background:var(--paper);width:100%}
.pop .row{justify-content:flex-end}
.hint{font-size:13px;color:var(--muted)}
.cue{position:fixed;z-index:15;left:50%;bottom:calc(max(20px,env(safe-area-inset-bottom,0px)) + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:var(--sheet);border:3px solid var(--accent);border-radius:28px;padding:10px 24px 10px 14px;box-shadow:0 12px 34px rgba(0,0,0,.2);max-width:calc(100% - 32px);pointer-events:none}
.cueN{font-family:var(--f-ui);font-weight:700;font-size:clamp(64px,14vw,130px);line-height:1;color:var(--accent);min-width:1.1em;text-align:center;font-variant-numeric:tabular-nums}
.cueN.go{font-family:var(--f-lyric);font-size:clamp(48px,10vw,96px)}
.cueN.pulse{animation:pulse .35s ease-out}
@keyframes pulse{from{transform:scale(1.35)}to{transform:scale(1)}}
.cueT{display:flex;flex-direction:column;gap:4px;min-width:0}
.cueT small{font-size:14px;color:var(--muted);letter-spacing:.1em}
.cueT span{font-family:var(--f-lyric);font-size:clamp(20px,4vw,34px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line.next{outline:3px dashed var(--accent);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.cueN.pulse{animation:none}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:999px;z-index:30;font-size:14px}
@media (max-width:560px){.ctl input[type=range]{width:90px}.title{font-size:22px}}
@media (prefers-reduced-motion:reduce){.line{transition:none}}
</style>

<div class="bar">
  <div class="row">
    <h1 class="title">手牽手</h1>
    <button class="play" id="play" aria-label="播放">▶</button>

  </div>
  <div class="row"><div class="chips" id="chips"></div></div>
</div>

<main id="sheet"></main>
<div class="pop" id="pop" hidden>

</div>

/* ---------- build sheet ---------- */
const TONES = 'ˊˇˋ';
function zyHTML(z){
  let light = false; if (z.endsWith('˙')) { light = true; z = z.slice(0,-1); }
  let tone = ''; if (TONES.includes(z.slice(-1))) { tone = z.slice(-1); z = z.slice(0,-1); }
  return '<span class="zy"><span class="zb">' + (light ? '<span class="lt">˙</span>' : '') + z +
         (tone ? '<span class="tn">' + tone + '</span>' : '') + '</span></span>';
}
const chEls = [], lineEls = [], secEls = [];
function buildSheet(){
  const m = $('sheet'); m.innerHTML = ''; chEls.length = lineEls.length = secEls.length = 0;
  S.sections.forEach((sec, si) => {
    const d = document.createElement('section'); d.className = 'sec';
    d.innerHTML = '<h2>' + sec.name + '</h2>';
    if (!sec.lines.length) {
      const l = document.createElement('div'); l.className = 'line';
      l.innerHTML = '<button class="lp" aria-label="播放' + sec.name + '">▶</button><span class="empty">（鋼琴演奏，沒有歌詞）</span>';
      l.querySelector('.lp').onclick = () => playRange(sec.t0, sec.t1, sec.name, true);
      d.appendChild(l);
    }
    sec.lines.forEach(li => {
      const L = S.lines[li];
      const l = document.createElement('div'); l.className = 'line';
      const b = document.createElement('button'); b.className = 'lp'; b.textContent = '▶'; b.setAttribute('aria-label','只播這一句');
      b.onclick = () => playRange(L.t0, L.t1 + 0.15, '這一句：' + lineText(li), true);
      const w = document.createElement('div'); w.className = 'lyr';
      for (let k = L.a; k <= L.b; k++) {
        const c = S.chars[k], e = document.createElement('span'); e.className = 'ch'; e.dataset.k = k;
        e.innerHTML = '<span class="h">' + c[0] + '</span>' + zyHTML(zyFix[c[0]] || c[1]);
        e.onclick = () => onCharTap(k, e);
        w.appendChild(e); chEls[k] = e;
      }
      l.append(b, w); d.appendChild(l); lineEls[li] = l;
    });
    m.appendChild(d); secEls[si] = d;
  });
}
const lineText = li => { const L = S.lines[li]; let s=''; for (let k=L.a;k<=L.b;k++) s += S.chars[k][0]; return s; };

/* long rests before a line: count the last four beats 4-3-2-1 */
const beatOf = t => { const b = S.beats; let lo = 0, hi = b.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (b[m] <= t) lo = m; else hi = m - 1; } const nx = b[lo+1] ?? b[lo] + 1; return lo + (t - b[lo]) / (nx - b[lo]); };
const CUES = [];
S.lines.forEach((L, li) => {
  const i = lb(S.mel, L.t0 - 0.001) - 1;
  if (i < 0) return;                                   /* song start is covered by the count-in */
  let end = 0; for (let j = Math.max(0, i - 8); j <= i; j++) end = Math.max(end, S.mel[j][0] + S.mel[j][1]);
  if (beatOf(L.t0) - beatOf(end) < 3) return;
  let jl = 0; while (jl + 1 < S.beats.length && S.beats[jl + 1] <= L.t0 - 0.05) jl++;
  const ticks = [jl - 3, jl - 2, jl - 1, jl].map(j => S.beats[j]);
  CUES.push({t: L.t0, li, ticks});
});

  const all = document.createElement('button'); all.className = 'chip'; all.textContent = '全曲'; all.dataset.r = 'all';
  all.onclick = () => playRange(0, S.total + 0.5, '全曲', false); c.appendChild(all);
  S.sections.forEach((s, i) => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = s.name; b.dataset.r = 's' + i;
    b.onclick = () => playRange(s.t0, s.t1, s.name, true); c.appendChild(b);
  });
}

/* ---------- audio ---------- */
let ctx, master, melBus, pnoBus, clickBus;
function ensureAudio(){
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
  master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp); comp.connect(ctx.destination);
  melBus = ctx.createGain(); pnoBus = ctx.createGain(); clickBus = ctx.createGain(); clickBus.gain.value = 0.5;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  melBus.connect(lp); lp.connect(master); pnoBus.connect(master); clickBus.connect(master);
  applyVol();
}
function applyVol(){
  if (!ctx) return;
  melBus.gain.setTargetAtTime(opt.mel ? opt.melVol/100*0.55 : 0, ctx.currentTime, 0.03);
  pnoBus.gain.setTargetAtTime(opt.pno ? opt.pnoVol/100*0.32 : 0, ctx.currentTime, 0.03);
}
const hz = p => 440 * Math.pow(2, (p - 69) / 12);
let voices = [];
function track(v){ voices.push(v); v.o[0].onended = () => { const i = voices.indexOf(v); if (i >= 0) voices.splice(i,1); }; }
function melNote(p, t, d){
  const g = ctx.createGain(), o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
  o1.type = 'triangle'; o2.type = 'sine'; o1.frequency.value = hz(p); o2.frequency.value = hz(p) * 2;
  const g2 = ctx.createGain(); g2.gain.value = 0.18;
  const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 5.3; lg.gain.value = 0;
  lfo.connect(lg); lg.connect(o1.detune); lg.connect(o2.detune);
  if (d > 0.45) { lg.gain.setValueAtTime(0, t + 0.25); lg.gain.linearRampToValueAtTime(14, t + 0.5); }
  const end = t + Math.max(0.08, d - 0.03);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.025); g.gain.setTargetAtTime(0.78, t + 0.03, 0.12);
  g.gain.setValueAtTime(0.78, end); g.gain.setTargetAtTime(0, end, 0.04);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(melBus);
  [o1,o2,lfo].forEach(o => { o.start(t); o.stop(end + 0.3); });
  track({g, o:[o1,o2,lfo]});
}
function pnoNote(p, t, d){
  const g = ctx.createGain(), o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g2 = ctx.createGain();
  o1.type = 'sine'; o2.type = 'triangle'; o1.frequency.value = hz(p); o2.frequency.value = hz(p) * 2; g2.gain.value = 0.25;
  const v = p < 48 ? 0.9 : 0.7, end = t + Math.max(0.1, d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.006);
  g.gain.setTargetAtTime(v * 0.18, t + 0.01, 0.55);
  g.gain.setTargetAtTime(0, end, 0.07);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(pnoBus);
  [o1,o2].forEach(o => { o.start(t); o.stop(end + 0.5); });
  track({g, o:[o1,o2]});
}
function click(t, strong){
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = strong ? 1600 : 1100;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.connect(g); g.connect(clickBus); o.start(t); o.stop(t + 0.08); track({g, o:[o]});
}
function silence(){
  const now = ctx.currentTime;
  voices.forEach(v => { try { v.g.gain.cancelScheduledValues(now); v.g.gain.setTargetAtTime(0, now, 0.015); v.o.forEach(o => o.stop(now + 0.08)); } catch(e){} });
  voices = [];
}

/* ---------- transport ---------- */
const T = {playing:false, from:0, to:S.total + 0.5, label:'全曲', pos:0, startCtx:0, origin:0, mi:0, pi:0, timer:null, chipKey:'all'};
const rate = () => opt.speed / 100;
const songNow = () => T.playing ? T.origin + (ctx.currentTime - T.startCtx) * rate() : T.pos;
function beatLen(t){ const b = S.beats; let i = Math.max(1, Math.min(b.length - 1, lb(b.map(x=>[x]), t))); return (b[i] - b[i-1]) / rate(); }

function startAt(origin, countIn){
  ensureAudio(); if (ctx.state === 'suspended') ctx.resume();
  silence();
  const bl = beatLen(Math.max(origin, 0.01));
  const ci = countIn ? 4 : 0;
  T.startCtx = ctx.currentTime + 0.1 + ci * bl;
  for (let k = 0; k < ci; k++) click(T.startCtx - (ci - k) * bl, k === 0);
  const blSong = bl * rate(), li0 = S.lines.findIndex(L => L.t1 > origin + 0.05);
  T.ciCue = ci ? {t: origin, li: li0, ticks: [4,3,2,1].map(k => origin - k * blSong), ci: true} : null;
  T.origin = origin; T.mi = lb(S.mel, origin - 0.005); T.pi = lb(S.pno, origin - 0.005);
  T.playing = true; $('play').textContent = '❚❚'; $('play').setAttribute('aria-label','暫停');
  clearInterval(T.timer); T.timer = setInterval(tick, 25); tick();
}
function tick(){
  const r = rate(), horizon = T.origin + (ctx.currentTime + 0.3 - T.startCtx) * r, lim = Math.min(horizon, T.to);
  const at = t => T.startCtx + (t - T.origin) / r;
  while (T.mi < S.mel.length && S.mel[T.mi][0] < lim) { const n = S.mel[T.mi++]; if (n[0] >= T.origin - 0.01) melNote(n[2], at(n[0]), Math.min(n[1], T.to - n[0]) / r); }
  while (T.pi < S.pno.length && S.pno[T.pi][0] < lim) { const n = S.pno[T.pi++]; if (n[0] >= T.origin - 0.01) pnoNote(n[2], at(n[0]), Math.min(n[1], T.to - n[0] + 0.3) / r); }
  if (songNow() >= T.to) {
    if (opt.loop) { T.origin = T.from; T.mi = lb(S.mel, T.from - 0.005); T.pi = lb(S.pno, T.from - 0.005); T.startCtx = ctx.currentTime + 0.6; }
    else { stop(true); }
  }
}
function pause(){ if (!T.playing) return; T.pos = Math.max(T.from, songNow()); T.playing = false; clearInterval(T.timer); silence(); setPlayBtn(); }
function stop(toStart){ T.playing = false; clearInterval(T.timer); if (ctx) silence(); T.pos = toStart ? T.from : T.pos; setPlayBtn(); paint(T.pos, true); }
function setPlayBtn(){ paintCue(0); $('play').textContent = '▶'; $('play').setAttribute('aria-label','播放'); }
function playRange(a, b, label, ci){
  T.from = a; T.to = b; T.label = label; T.pos = a;
  const key = label === '全曲' ? 'all' : (S.sections.findIndex(s => s.name === label) >= 0 ? 's' + S.sections.findIndex(s => s.name === label) : '');
  T.chipKey = key; markChips(); updateWhere();
  startAt(a, ci && opt.ci);
}
function markChips(){ document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.r === T.chipKey))); }
function updateWhere(){ $('where').innerHTML = '範圍：<b>' + T.label + '</b>' + (opt.loop ? '　🔁 循環中' : ''); }

/* ---------- highlighting ---------- */
let lastK = -2, lastLine = -1, lastSec = -1;
const charStarts = S.chars.map(c => [c[2]]);
function charAt(t){
  const i = lb(charStarts, t + 0.0001) - 1;
  if (i < 0) return -1;
  const c = S.chars[i], next = S.chars[i+1];
  if (t > c[3] + 0.35 && (!next || t < next[2])) return -(i + 10);  /* between phrases: none lit */
  return i;
}
function lineOf(k){ return S.lines.findIndex(L => k >= L.a && k <= L.b); }
function paint(t, force){
  let k = charAt(t); const gap = k < -1; if (gap) k = -k - 10;
  const lit = gap ? -1 : k;
  if (lit !== lastK || force) {
    const li = k >= 0 ? lineOf(k) : -1;
    if (li !== lastLine || force) {
      lineEls.forEach(e => e && e.classList.remove('cur'));
      document.querySelectorAll('.ch.done,.ch.on').forEach(e => e.classList.remove('done','on'));
      if (li >= 0) { lineEls[li].classList.add('cur'); if (opt.scroll && T.playing) lineEls[li].scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
      lastLine = li;
    }
    if (li >= 0) {
      const L = S.lines[li];
      for (let j = L.a; j <= L.b; j++) { chEls[j].classList.toggle('on', j === lit); chEls[j].classList.toggle('done', j < k || (gap && j === k)); }
    }
    lastK = lit;
  }
  const si = S.sections.findIndex(s => t >= s.t0 && t < s.t1);
  if (si !== lastSec) { secEls.forEach(e => e.classList.remove('cur')); if (si >= 0) secEls[si].classList.add('cur'); lastSec = si; }
  paintCue(t);
  if (!seeking) $('seek').value = (Math.max(0, t) / S.total * 100).toFixed(1);
}
let cueShown = '', nextLine = -1;
function paintCue(t){
  let c = null;
  if (T.playing && opt.cue) {
    if (T.ciCue && t < T.ciCue.t + 0.5) c = T.ciCue;
    else for (const q of CUES) { if (t >= q.ticks[0] - 0.03 && t < q.t + 0.5) { c = q; break; } if (q.ticks[0] > t) break; }
  }
  const box = $('cue');
  let nl = -1;
  if (!c) { if (!box.hidden) box.hidden = true; cueShown = ''; }
  else {
    const n = c.ticks.filter(x => x <= t + 0.03).length;
    const txt = t >= c.t - 0.03 ? '唱！' : (n ? String(5 - n) : '');
    if (txt && txt !== cueShown) {
      const N = $('cueN'); N.textContent = txt; N.classList.toggle('go', txt === '唱！');
      N.classList.remove('pulse'); void N.offsetWidth; N.classList.add('pulse');
      $('cueS').textContent = txt === '唱！' ? '開始唱' : (c.ci ? '預備，準備開始' : '空拍結束，準備進來');
      $('cueL').textContent = c.li >= 0 ? lineText(c.li) : '';
      cueShown = txt;
    }
    if (txt) { box.hidden = false; if (txt !== '唱！') nl = c.li; }
  }
  if (nl !== nextLine) {
    if (nextLine >= 0 && lineEls[nextLine]) lineEls[nextLine].classList.remove('next');
    if (nl >= 0 && lineEls[nl]) { lineEls[nl].classList.add('next'); if (opt.scroll) lineEls[nl].scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
    nextLine = nl;
  }
}
function frame(){ if (T.playing) paint(songNow()); requestAnimationFrame(frame); }

/* ---------- interactions ---------- */
let seeking = false, editMode = false, peekTimer;
function onCharTap(k, e){
  if (editMode) return openPop(S.chars[k][0]);
  if (opt.hide) { e.classList.add('peek'); clearTimeout(peekTimer); peekTimer = setTimeout(() => e.classList.remove('peek'), 1500); return; }
  const li = lineOf(k);  /* tap a character: sing from here to the end of the current range */
  const a = S.chars[k][2];
  if (a < T.from || a >= T.to) { T.from = 0; T.to = S.total + 0.5; T.label = '全曲'; T.chipKey = 'all'; markChips(); updateWhere(); }
  startAt(a, opt.ci);
}
$('play').onclick = () => { if (T.playing) pause(); else startAt(T.pos < T.from || T.pos >= T.to ? T.from : T.pos, opt.ci); };
$('restart').onclick = () => { T.pos = T.from; if (T.playing) startAt(T.from, opt.ci); else paint(T.from, true); };
document.addEventListener('keydown', e => { if (e.code === 'Space' && !/INPUT|BUTTON/.test(e.target.tagName)) { e.preventDefault(); $('play').click(); } });
const seek = $('seek');
seek.addEventListener('input', () => { seeking = true; });
seek.addEventListener('change', () => {
  seeking = false; const t = seek.value / 100 * S.total;
  T.from = 0; T.to = S.total + 0.5; T.label = '全曲'; T.chipKey = 'all'; markChips(); updateWhere();
  T.pos = t; if (T.playing) startAt(t, false); else paint(t, true);
});
function toggle(id, key, after){
  const b = $(id); b.setAttribute('aria-pressed', String(opt[key]));
  b.onclick = () => { opt[key] = !opt[key]; b.setAttribute('aria-pressed', String(opt[key])); saveOpt(); after && after(); };
}
toggle('loop','loop', updateWhere);
toggle('zyBtn','zy', () => document.body.classList.toggle('noZy', !opt.zy));
toggle('hideBtn','hide', () => document.body.classList.toggle('hideLyr', opt.hide));
toggle('melBtn','mel', applyVol); toggle('pnoBtn','pno', applyVol);
toggle('ciBtn','ci'); toggle('cueBtn','cue'); toggle('scrollBtn','scroll');
$('editBtn').onclick = () => { editMode = !editMode; $('editBtn').setAttribute('aria-pressed', String(editMode)); toast(editMode ? '點任何一個字來修改注音' : '已結束修改'); };
$('moreBtn').onclick = () => { const m = $('more'); m.hidden = !m.hidden; $('moreBtn').setAttribute('aria-expanded', String(!m.hidden)); $('moreBtn').textContent = m.hidden ? '更多設定 ▾' : '收起設定 ▴'; };
function slider(id, key, out, fmt, after){
  const s = $(id); s.value = opt[key]; if (out) $(out).textContent = fmt(opt[key]);
  s.addEventListener('input', () => { opt[key] = +s.value; if (out) $(out).textContent = fmt(opt[key]); after && after(); });
  s.addEventListener('change', saveOpt);
}
slider('speed','speed','speedV', v => v + '%', () => { if (T.playing) { const t = songNow(); startAt(Math.max(T.from, t), false); } });
slider('size','size','sizeV', v => v, () => document.documentElement.style.setProperty('--lyric', opt.size + 'px'));
slider('melVol','melVol', null, null, applyVol); slider('pnoVol','pnoVol', null, null, applyVol);

/* zhuyin edit popover */
let popCh = '';
function openPop(ch){ popCh = ch; $('popCh').textContent = ch; $('popIn').value = zyFix[ch] || S.chars.find(c => c[0] === ch)[1]; $('pop').hidden = false; $('popIn').focus(); }
$('popCancel').onclick = () => { $('pop').hidden = true; };
$('popOk').onclick = () => { const v = $('popIn').value.trim(); if (v) zyFix[popCh] = v; store.set('zy', zyFix); $('pop').hidden = true; rebuild(); toast('已更新「' + popCh + '」的注音'); };
$('popReset').onclick = () => { delete zyFix[popCh]; store.set('zy', zyFix); $('pop').hidden = true; rebuild(); toast('已還原「' + popCh + '」的注音'); };
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 1800); }
function rebuild(){ buildSheet(); lastK = -2; lastLine = -1; lastSec = -1; paint(songNow(), true); }

document.documentElement.style.setProperty('--lyric', opt.size + 'px');
document.body.classList.toggle('noZy', !opt.zy); document.body.classList.toggle('hideLyr', opt.hide);
buildSheet(); buildChips(); markChips(); updateWhere(); paint(0, true); requestAnimationFrame(frame);
</script>
